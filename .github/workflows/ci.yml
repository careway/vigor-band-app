name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.41.9', cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Kotlin unit tests (JVM)
        working-directory: android
        run: ./gradlew testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vigor-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  publish-latest:
    needs: build-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.41.9', cache: true }
      - run: flutter pub get
      - name: Build release APK
        # versionCode = numero de ejecucion: la app lo compara con "build: N" de la release para saber si hay version nueva.
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Publish as rolling release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk vigor-latest.apk
          gh release delete latest --cleanup-tag --yes || true
          # La linea "build: N" la lee la app (lib/data/updater.dart, parseBuild). No cambiar el formato sin cambiar el parser.
          printf 'build: %s\n\nAPK release firmado con la clave de depuración, solo para pruebas. Commit %s.\n' "${{ github.run_number }}" "${GITHUB_SHA::7}" > notes.txt
          gh release create latest vigor-latest.apk --prerelease --target "$GITHUB_SHA" \
            --title "Última versión (main)" \
            --notes-file notes.txt
