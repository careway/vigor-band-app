name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: '3.41.9', cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.VIGOR_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::Falta el secreto VIGOR_KEYSTORE_B64: se firma con la clave de depuracion y la app no se podra actualizar sobre una instalacion anterior."
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/vigor-release.p12"
            echo "VIGOR_KEYSTORE_PATH=$RUNNER_TEMP/vigor-release.p12" >> "$GITHUB_ENV"
          fi
      - name: Build release APK
        env:
          VIGOR_KEYSTORE_PASSWORD: ${{ secrets.VIGOR_KEYSTORE_PASSWORD }}
          VIGOR_KEY_ALIAS: vigor
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Rename
        run: cp build/app/outputs/flutter-apk/app-release.apk vigor-${{ github.ref_name }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: vigor-${{ github.ref_name }}.apk
          generate_release_notes: true
